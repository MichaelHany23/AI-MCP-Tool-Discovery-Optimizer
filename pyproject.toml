[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-tool-discovery-optimizer"
version = "0.1.0"
description = "Benchmark and optimize how AI agents discover and use MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "MCP-TDO contributors" },
]
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=1.9,<2",
  "pydantic>=2.11,<3",
  "sqlmodel>=0.0.24,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
stats = [
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<1",
]
tracking = [
  "mlflow>=2.21,<3",
  "pyarrow>=19,<21",
]

[project.scripts]
mcp-tdo = "mcp_tdo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mcp_tdo"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["mcp_tdo", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_tdo"]
